[settings]
experimental = true

[tools]
"aqua:dahlia/hongdown" = "0.5.3"
"aqua:fish-shell/fish-shell" = { version = "latest", os = ["linux", "macos"] }
bun = "1.3"
"github:dahlia/sacho" = "0.3.2"
"github:PowerShell/PowerShell" = "latest"
"github:nushell/nushell" = "latest"
"github:pnpm/pnpm" = "11.28.6"
node = "26"

[deps.pnpm]
auto = true

[hooks.postinstall]
shell = "nu -c"
run = """
mise deps
node scripts/install_hooks.ts
"""

[tasks."setup:deno"]
description = "Prepare the explicit Deno compatibility environment"
tools = { deno = "2.9" }
run = 'deno cache --frozen --node-modules-dir=none "packages/*/src/index.ts"'

[tasks."setup:deno:smoke"]
description = "Verify Deno setup preserves pnpm-managed dependencies"
tools = { deno = "2.9" }
run = "node scripts/setup_deno.smoke.ts"

[tasks.check]
description = "Check code formatting, linting, and type checking"
depends = ["check:*"]
run = "sacho check"

[tasks."check:versions"]
description = "Check that all subpackages have matching versions"
usage = '''
flag "--fix" help="Automatically fix version mismatches"
'''
shell = "nu -c"
run = '''
if $env.usage_fix? == "true" {
  node scripts/check_versions.ts --fix
} else {
  node scripts/check_versions.ts
}
'''

[tasks."check:type"]
tools = { deno = "2.9" }
description = "Check TypeScript code"
run = "deno check"

[tasks."check:lint"]
tools = { deno = "2.9" }
description = "Check lint"
run = "deno lint"

[tasks."check:fmt"]
tools = { deno = "2.9" }
description = "Check source format (except for Markdown docs)"
run = "deno fmt --check"

[tasks."check:fmt-md"]
description = "Check Markdown docs format"
run = "hongdown --check"

[tasks."check:publish"]
tools = { deno = "2.9" }
description = "Check if publishing is ready"
run = "deno publish --dry-run --allow-dirty"

[tasks."bump-version"]
description = "Bump the version of all packages"
usage = """
arg "<version>" help="Version to bump to (e.g., 1.2.3)"
"""
shell = "nu -c"
run = """
sacho next $env.usage_version
node scripts/bump_version.ts $env.usage_version
"""

[tasks.fmt]
tools = { deno = "2.9" }
description = "Format source files"
run = ["deno fmt", "hongdown --write", "mise fmt"]

[tasks."test:deno"]
tools = { deno = "2.9" }
description = "Run the test suite using Deno"
run = "deno task test"

[tasks."test:node"]
description = "Run the test suite using Node.js"
depends = ["build"]
run = ["pnpm run -r test", "pnpm run test"]

[tasks."test:bun"]
description = "Run the test suite using Bun"
depends = ["build"]
run = "pnpm run -r test:bun"

[tasks.test]
description = "Run the test suite across all environments"
depends = ["check", "test:*"]

[tasks.build]
description = "Build all packages for npm publishing"
run = "pnpm run --filter '!{docs}' -r build"

[tasks."testing:cli:build"]
description = "Build the testing package and its dependencies"
run = 'pnpm --filter "@optique/testing..." -r build'

[tasks."testing:cli:deno"]
tools = { deno = "2.9" }
description = "Test the CLI boundary using Deno"
depends = ["testing:cli:build"]
dir = "packages/testing"
run = "deno test --allow-read --allow-write --allow-env --allow-run src/cli.test.ts src/cli-cleanup.test.ts src/public-api.test.ts"

[tasks."testing:cli:node"]
description = "Test the CLI boundary using Node.js"
depends = ["testing:cli:build"]
dir = "packages/testing"
run = "node --test src/cli.test.ts src/cli-cleanup.test.ts src/public-api.test.ts"

[tasks."testing:cli:bun"]
description = "Test the CLI boundary using Bun"
depends = ["testing:cli:build"]
dir = "packages/testing"
run = "bun test src/cli.test.ts src/cli-cleanup.test.ts src/public-api.test.ts"

[tasks."testing:cli"]
description = "Test the CLI boundary across all runtimes"
depends = ["testing:cli:deno", "testing:cli:node", "testing:cli:bun"]

[tasks.coverage]
tools = { deno = "2.9" }
description = "Measure test coverage"
run = [
  "deno test --allow-read --allow-write --allow-run --allow-env --allow-net --allow-sys --allow-ffi --env-file=.env.test --coverage=coverage/raw",
  'deno coverage coverage/raw --lcov --include="packages/" --output=coverage/lcov.info',
  'deno coverage coverage/raw --include="packages/"',
]

[tasks."file-inspect:deps"]
description = "Install the file inspection workspace dependencies"
run = "pnpm install"

[tasks."file-inspect:build"]
description = "Build the file inspection recipe and its test dependencies"
run = 'pnpm --filter "file-inspect..." -r build'

[tasks."file-inspect:test:deno"]
tools = { deno = "2.9" }
description = "Check and test the file inspection recipe with Deno"
dir = "examples/file-inspect"
run = "deno task test"

[tasks."file-inspect:test:node"]
description = "Test the file inspection recipe with Node.js"
depends = ["file-inspect:build"]
run = "pnpm --filter file-inspect test"

[tasks."file-inspect:test:bun"]
description = "Test the file inspection recipe with Bun"
depends = ["file-inspect:build"]
run = "pnpm --filter file-inspect test:bun"

[tasks."file-inspect:test"]
description = "Test the file inspection recipe across all runtimes"
depends = ["file-inspect:test:deno", "file-inspect:test:node", "file-inspect:test:bun"]

[tasks."file-inspect:standalone"]
description = "Compile the verified JS bundle for the current host"
depends = ["file-inspect:build"]
dir = "examples/file-inspect"
run = "node scripts/standalone.ts"

[tasks."file-inspect:smoke"]
description = "Verify offline npm installation, standalone output and Bash completion"
depends = ["file-inspect:standalone"]
dir = "examples/file-inspect"
run = "node scripts/smoke.ts"

[tasks."tsv-to-csv:deps"]
description = "Install the file conversion workspace dependencies"
run = "pnpm install"

[tasks."tsv-to-csv:build"]
description = "Build the packages the file conversion example uses"
run = 'pnpm --filter "tsv-to-csv^..." -r build'

[tasks."tsv-to-csv:test:deno"]
tools = { deno = "2.9" }
description = "Check and test the file conversion example with Deno"
dir = "examples/tsv-to-csv"
run = "deno task test"

[tasks."tsv-to-csv:test:node"]
description = "Test the file conversion example with Node.js"
depends = ["tsv-to-csv:build"]
run = "pnpm --filter tsv-to-csv test"

[tasks."tsv-to-csv:test:bun"]
description = "Test the file conversion example with Bun"
depends = ["tsv-to-csv:build"]
run = "pnpm --filter tsv-to-csv test:bun"

[tasks."tsv-to-csv:test"]
description = "Test the file conversion example across all runtimes"
depends = ["tsv-to-csv:test:deno", "tsv-to-csv:test:node", "tsv-to-csv:test:bun"]

[tasks."benchmark:test"]
description = "Test startup baseline measurement contracts"
run = "node --test benchmarks/startup/*.test.ts"

[tasks."benchmark:build"]
description = "Build packages used by startup fixtures"
run = 'pnpm --workspace-concurrency=1 --filter "@optique/discover..." -r build'

[tasks."benchmark:prepare"]
tools = { deno = "2.9" }
description = "Pack and verify isolated startup consumers"
depends = ["benchmark:build"]
run = "node benchmarks/startup/harness.ts prepare"

[tasks."benchmark:validate"]
tools = { deno = "2.9" }
description = "Validate startup fixture behavior and module loading"
run = "node benchmarks/startup/harness.ts validate"

[tasks."benchmark:smoke"]
tools = { deno = "2.9" }
description = "Write a bounded informational startup smoke report"
run = "node benchmarks/startup/harness.ts smoke"

[tasks."benchmark:baseline"]
tools = { deno = "2.9" }
description = "Run three full 100-sample startup baselines"
run = "node benchmarks/startup/harness.ts baseline"
