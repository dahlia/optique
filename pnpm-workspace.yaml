  "@inquirer/prompts": ^8.3.0
  "@jellybrick/dbus-next": 0.11.3
  "@logtape/file": ^2.2.2
  "@logtape/logtape": ^2.2.2
  "@napi-rs/keyring": 2.0.0
  "@standard-schema/spec": ^1.1.0
  "@types/node": ^24.0.0
  fast-check: ^4.7.0
  isomorphic-git: ^1.36.1
  tsdown: ^0.13.0
  tsx: ^4.21.0
  typescript: ^5.8.3
  yaml: ^2.9.1
  valibot: ^1.2.0
