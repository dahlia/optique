packages:
  - packages/*
  - examples/*
  - docs
  - benchmarks/startup

ignoreWorkspaceCycles: true

catalog:
  "@types/deno": 2.7.0
  "@js-temporal/polyfill": 0.5.1
  c8: 12.0.0
  oxlint: 1.94.0
  oxfmt: 0.79.0
  "@clack/prompts": ^1.6.0
  "@inquirer/prompts": ^8.3.0
  "@jellybrick/dbus-next": 0.11.3
  "@logtape/file": ^2.2.2
  "@logtape/logtape": ^2.2.2
  "@napi-rs/keyring": 2.0.0
  "@standard-schema/spec": ^1.1.0
  "@types/node": ^24.0.0
  fast-check: ^4.7.0
  isomorphic-git: ^1.36.1
  tsdown: ^0.13.0
  tsx: ^4.21.0
  typescript: ^5.8.3
  yaml: ^2.9.1
  valibot: ^1.2.0
  zod: "^3.25.0 || ^4.0.0"

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

engineStrict: true
nodeVersion: 26.13.1
# Temporary popup compilation fix from shikijs/shiki#1349 at
# a5afc63679578b5d197665a8286ada283e76347b. Remove after verifying that
# the installed release contains the fix and documentation checks pass.
patchedDependencies:
  '@shikijs/vitepress-twoslash@4.6.0': patches/@shikijs__vitepress-twoslash@4.6.0.patch
